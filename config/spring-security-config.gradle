def rncToXsd = tasks.named('rncToXsd', RncToXsd)
rncToXsd.configure {
	rncDir = file('src/main/resources/org/springframework/security/config/')
	xsdDir = rncDir
	xslFile = new File(rncDir, 'spring-security.xsl')
}

def versionlessXsd = tasks.register("versionlessXsd", CreateVersionlessXsdTask) {
	inputFiles.from(rncToXsd.map { task -> project.fileTree(task.xsdDir) })
	versionlessXsdFile = project.layout.buildDirectory.file("versionlessXsd/spring-security.xsd")
}

tasks.named('processResources', ProcessResources).configure {
	from(versionlessXsd) {
		into 'org/springframework/security/config/'
	}
	from(rncToXsd) {
		duplicatesStrategy DuplicatesStrategy.EXCLUDE
		into 'org/springframework/security/config/'
	}
}

tasks.named('sourcesJar', Jar).configure {
	from(rncToXsd) {
		duplicatesStrategy DuplicatesStrategy.EXCLUDE
		into 'org/springframework/security/config/'
	}
}

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		languageVersion = "1.3"
		apiVersion = "1.3"
		freeCompilerArgs = ["-Xjsr305=strict", "-Xsuppress-version-warnings"]
		jvmTarget = "1.8"
	}
}

compileTestJava {
	exclude "org/springframework/security/config/annotation/web/configurers/saml2/**", "org/springframework/security/config/http/Saml2*"
}

task compileSaml2TestJava(type: JavaCompile) {
	dependsOn compileTestJava
	javaCompiler = javaToolchains.compilerFor {
		languageVersion = JavaLanguageVersion.of(11)
	}
	source = sourceSets.test.java.srcDirs
	include "org/springframework/security/config/annotation/web/configurers/saml2/**", "org/springframework/security/config/http/Saml2*"
	classpath = sourceSets.test.compileClasspath + files(compileTestJava.destinationDirectory)
	destinationDirectory = new File("${buildDir}/classes/java/saml2Test")
}

// Register the isolated SAML2 test output as part of the test source set output. This makes
// testJar package the SAML2 test classes, and gives every consumer of sourceSets.test.output
// (testJar, test, checkstyleTest, checkstyleIntegrationTest, compileIntegrationTestJava) an
// implicit build dependency on compileSaml2TestJava via builtBy, avoiding the output-directory
// race that previously left the config test jar incomplete under parallel builds.
sourceSets.test.output.dir(compileSaml2TestJava.destinationDirectory, builtBy: compileSaml2TestJava)

task saml2Tests(type: Test) {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(11)
	}
	// output.dir(...) extras are not part of sourceSets.test.output.classesDirs, so point the
	// task at the isolated SAML2 output directory explicitly; the runtime classpath already
	// includes it via sourceSets.test.runtimeClasspath.
	testClassesDirs = files(compileSaml2TestJava.destinationDirectory)
	filter {
		includeTestsMatching "org.springframework.security.config.annotation.web.configurers.saml2.*"
	}
	useJUnitPlatform()
	dependsOn compileSaml2TestJava
}

test {
	shouldRunAfter saml2Tests
}

tasks.named('check') {
	dependsOn saml2Tests
}

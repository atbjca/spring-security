apply plugin: 'io.spring.convention.spring-module'

dependencies {
	management platform(project(":bjca-footstone-bpring-security-dependencies"))
	api project(':bjca-footstone-bpring-security-core')
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-core'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-web'

	optional 'com.fasterxml.jackson.core:jackson-databind'
	optional 'com.nimbusds:oauth2-oidc-sdk'
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-webflux'

	testImplementation "org.assertj:assertj-core"
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testImplementation "org.junit.jupiter:junit-jupiter-engine"
	testImplementation "org.mockito:mockito-core"
	testImplementation "org.mockito:mockito-junit-jupiter"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-test"

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

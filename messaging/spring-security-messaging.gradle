apply plugin: 'io.spring.convention.spring-module'

dependencies {
	management platform(project(":bjca-footstone-bpring-security-dependencies"))
	api project(':bjca-footstone-bpring-security-core')
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-beans'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-context'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-core'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-expression'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-messaging'

	optional project(':bjca-footstone-bpring-security-web')
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-websocket'
	optional 'io.projectreactor:reactor-core'
	optional 'jakarta.servlet:jakarta.servlet-api'

	testImplementation project(path: ':bjca-footstone-bpring-security-core', configuration: 'tests')
	testImplementation "org.assertj:assertj-core"
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testImplementation "org.junit.jupiter:junit-jupiter-engine"
	testImplementation "org.mockito:mockito-core"
	testImplementation "org.mockito:mockito-junit-jupiter"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-test"
	testImplementation "org.slf4j:slf4j-api"
	testImplementation "org.slf4j:log4j-over-slf4j"
	testImplementation "ch.qos.logback:logback-classic"

	testRuntimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

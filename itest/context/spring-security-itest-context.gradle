apply plugin: 'io.spring.convention.spring-test'

dependencies {
	implementation platform(project(":bjca-footstone-bpring-security-dependencies"))
	implementation project(':bjca-footstone-bpring-security-core')
	implementation 'org.python:jython'
	implementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-aop'
	implementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-beans'
	implementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-context'
	implementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-tx'

	testImplementation project(':bjca-footstone-bpring-security-web')
	testImplementation 'jakarta.servlet:jakarta.servlet-api'
	testImplementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-web'
	testImplementation "org.assertj:assertj-core"
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testImplementation "org.junit.jupiter:junit-jupiter-engine"
	testImplementation "org.mockito:mockito-core"
	testImplementation "org.mockito:mockito-junit-jupiter"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-test"

	testRuntimeOnly project(':bjca-footstone-bpring-security-config')
	testRuntimeOnly 'org.aspectj:aspectjweaver'
}

System.setProperty('python.cachedir.skip', 'true')

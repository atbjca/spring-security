pluginManagement {
	repositories {
		mavenLocal()
		mavenCentral()
		gradlePluginPortal()
		// Nexus 私服仓库（Gradle 插件下载源，凭证见 ~/.gradle/gradle.properties）
		maven {
			name = 'nexus'
			url = nexusPublicUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
		}
		if (version.endsWith('-SNAPSHOT')) {
			// SNAPSHOT 构建时额外启用快照仓库，拉取内部 fork 的 SNAPSHOT 插件/依赖
			maven {
				name = 'nexus-snapshots'
				url = nexusSnapshotUrl
				allowInsecureProtocol = true
				credentials {
					username = nexusUsername
					password = nexusPassword
				}
			}
		}
		maven { url "https://repo.spring.io/milestone" }
	}
}

plugins {
	id "io.spring.develocity.conventions" version "0.0.25"
}

rootProject.name = 'spring-security'

FileTree buildFiles = fileTree(rootDir) {
	List excludes = gradle.startParameter.projectProperties.get("excludeProjects")?.split(",")
	include '**/*.gradle', '**/*.gradle.kts'
	exclude 'build', '**/gradle', 'settings.gradle', 'buildSrc', '/build.gradle', '.*', 'out'
	exclude '**/grails3'
	if(excludes) {
		exclude excludes
	}
}

String rootDirPath = rootDir.absolutePath + File.separator
buildFiles.each { File buildFile ->

	boolean isDefaultName = 'build.gradle'.equals(buildFile.name)
	boolean isKotlin = buildFile.name.endsWith(".kts")
	if(isDefaultName) {
		String buildFilePath = buildFile.parentFile.absolutePath
		String projectName = buildFilePath.tokenize(File.separator)[-1]
		configureProject(':' + projectName, projectName, buildFile)
	} else {
		String projectName
		if (isKotlin) {
			projectName = buildFile.name.replace('.gradle.kts', '')
		} else {
		 	projectName = buildFile.name.replace('.gradle', '')
		}
		configureProject(':' + projectName, projectName, buildFile)
	}
}

// =============================================================================
// GAV 去特征化：动态重命名 Gradle project.name（即 Maven ArtifactId）
// =============================================================================
// 约束：仅修改构建坐标，不修改物理目录名与 Java package
// 规则：spring-security-xxx → bjca-footstone-bpring-security-xxx
// 示例：spring-security-core → bjca-footstone-bpring-security-core
String renameArtifactId(String projectName) {
	if (projectName.startsWith('spring-security-')) {
		return projectName.replace('spring-security-', 'bjca-footstone-bpring-security-')
	}
	return projectName
}

// 注册子项目：include 使用重命名后的 projectPath，buildFileName 仍指向原始 .gradle 文件
def configureProject(String projectPath, String projectName, File buildFile) {
	String renamedProjectName = renameArtifactId(projectName)
	include(':' + renamedProjectName)

	def project = findProject(':' + renamedProjectName)
	project.name = renamedProjectName
	project.projectDir = buildFile.parentFile
	project.buildFileName = buildFile.name
}

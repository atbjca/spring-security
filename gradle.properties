# =============================================================================
# BJCA 内部维护分支构建属性
# =============================================================================
# 项目全局 GroupId：替换官方 org.springframework.security，规避 SCA 工具按 GAV 特征误报 CVE
projectGroup=cn.bjca.footstone.bpring.security
springBootVersion=3.3.3
# 内部补丁版本号：基于 upstream 6.5.11 发布线，后缀 nes.patch.1 标识手工维护版本
version=6.5.11-nes.patch.1
# springSecurityVersion —— Spring Security 原始基线版本号
# 用途：构建时注入 SpringSecurityCoreVersion.getVersion()，标识所基于的上游版本（对齐 spring-boot-2.7 做法）
springSecurityVersion=6.5.11
# 克隆官方 samples 仓库时使用的分支名
samplesBranch=6.5.x
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false

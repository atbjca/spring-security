import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

import java.util.concurrent.Callable

apply plugin: 'io.spring.convention.spring-module'
apply plugin: 'kotlin'

// =============================================================================
// javaTemplates：构建时展开 springSecurityVersion，避免在 Java 源码中硬编码版本号
// 对齐 spring-boot-2.7 的 SpringBootVersion.java + syncJavaTemplates 模式
// =============================================================================
def syncJavaTemplates = tasks.register('syncJavaTemplates', Sync) {
	from('src/main/javaTemplates')
	into(layout.buildDirectory.dir('generated-sources/javaTemplates'))
	def templateProperties = [
		'springSecurityVersion': findProperty('springSecurityVersion') ?: version
	]
	expand(templateProperties)
	inputs.properties(templateProperties)
}

sourceSets {
	main {
		java {
			srcDir(syncJavaTemplates)
		}
	}
}

tasks.named('compileJava') {
	dependsOn(syncJavaTemplates)
}

tasks.named('compileKotlin') {
	dependsOn(syncJavaTemplates)
}

// 格式化检查：排除生成源码（expand 可能改变换行），改为检查模板源文件
tasks.named('checkFormatMain') {
	def generatedSources = fileTree(layout.buildDirectory.dir('generated-sources/javaTemplates'))
	exclude { candidate -> generatedSources.contains(candidate.file) }
	source(fileTree('src/main/javaTemplates'))
}

// =============================================================================
// 依赖坐标说明（GAV 重命名）
// =============================================================================
// - 内部模块：project(':bjca-footstone-bpring-security-*')
// - Spring Framework：cn.bjca.footstone.bpring:bjca-footstone-bpring-*
//   替代官方 org.springframework:spring-*，Java import 无需修改
dependencies {
	management platform(project(":bjca-footstone-bpring-security-dependencies"))
	api project(':bjca-footstone-bpring-security-crypto')
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-aop'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-beans'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-context'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-core'
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-expression'
	api 'io.micrometer:micrometer-observation'

	optional 'com.fasterxml.jackson.core:jackson-databind'
	optional 'io.micrometer:context-propagation'
	optional 'io.projectreactor:reactor-core'
	optional 'jakarta.annotation:jakarta.annotation-api'
	optional 'org.aspectj:aspectjrt'
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-jdbc'
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-tx'
	optional 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'

	testImplementation 'commons-collections:commons-collections'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation "org.assertj:assertj-core"
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testImplementation "org.junit.jupiter:junit-jupiter-engine"
	testImplementation "org.mockito:mockito-core"
	testImplementation "org.mockito:mockito-junit-jupiter"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-core-test"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-test"
	testImplementation 'org.skyscreamer:jsonassert'
	testImplementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-reflect'
	testImplementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
	testImplementation 'io.mockk:mockk'

	testRuntimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 将解析到的 Spring Framework 版本写入 META-INF/spring-security.versions，
// 供 SpringSecurityCoreVersion 在运行时读取最低兼容版本
task springVersion(type: org.gradle.api.tasks.WriteProperties) {
	destinationFile = file("${buildDir}/versions/spring-security.versions")
	// key 使用内部 fork 的 core 模块 GAV，与 SpringSecurityCoreVersion.getSpringVersion() 对应
	property("cn.bjca.footstone.bpring:bjca-footstone-bpring-core", springVersion())
}

tasks.processResources {
	into('META-INF') {
		from project.tasks.springVersion.outputs
	}
}

configure(project.tasks.withType(Test)) {
	doFirst {
		systemProperties['springSecurityVersion'] = version
		systemProperties['springVersion'] = springVersion().call()
	}
}

// 从 compileClasspath 中解析内部 fork 的 spring-core 构件版本号
Callable<String> springVersion() {
	return  (Callable<String>) { project.configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
    .find { it.name == 'bjca-footstone-bpring-core' }.moduleVersion.id.version }
}

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		languageVersion = "1.7"
		apiVersion = "1.7"
		freeCompilerArgs = ["-Xjsr305=strict", "-Xsuppress-version-warnings"]
		jvmTarget = "17"
	}
}

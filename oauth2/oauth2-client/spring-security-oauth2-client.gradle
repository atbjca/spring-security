apply plugin: 'io.spring.convention.spring-module'

dependencies {
	management platform(project(":bjca-footstone-bpring-security-dependencies"))
	api project(':bjca-footstone-bpring-security-core')
	api project(':bjca-footstone-bpring-security-oauth2-core')
	api project(':bjca-footstone-bpring-security-web')
	api 'cn.bjca.footstone.bpring:bjca-footstone-bpring-core'
	api 'com.nimbusds:oauth2-oidc-sdk'

	optional project(':bjca-footstone-bpring-security-oauth2-jose')
	optional 'io.projectreactor:reactor-core'
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-webflux'
	optional 'com.fasterxml.jackson.core:jackson-databind'
	optional 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-jdbc'
	optional 'cn.bjca.footstone.bpring:bjca-footstone-bpring-r2dbc'

	testImplementation project(path: ':bjca-footstone-bpring-security-oauth2-core', configuration: 'tests')
	testImplementation project(path: ':bjca-footstone-bpring-security-oauth2-jose', configuration: 'tests')
	testImplementation 'com.squareup.okhttp3:mockwebserver'
	testImplementation 'io.micrometer:context-propagation'
	testImplementation 'io.projectreactor.netty:reactor-netty'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.skyscreamer:jsonassert'
	testImplementation 'io.r2dbc:r2dbc-h2:1.0.0.RELEASE'
	// r2dbc-spi-test 会传递引入 spring-jdbc/spring-tx 5.2.6；GAV 重命名后 BOM 无法覆盖 org.springframework 坐标，需显式排除
	testImplementation('io.r2dbc:r2dbc-spi-test:0.9.1.RELEASE') {
		exclude group: 'org.springframework', module: 'spring-jdbc'
		exclude group: 'org.springframework', module: 'spring-tx'
	}
	// R2dbc 测试需内部 fork 的 r2dbc/tx（optional 仅编译期可见，测试 runtime 需显式声明）
	testImplementation 'cn.bjca.footstone.bpring:bjca-footstone-bpring-r2dbc'
	testImplementation "org.assertj:assertj-core"
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
	testImplementation "org.junit.jupiter:junit-jupiter-engine"
	testImplementation "org.mockito:mockito-core"
	testImplementation "org.mockito:mockito-junit-jupiter"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-test"

	testRuntimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	provided 'jakarta.servlet:jakarta.servlet-api'
}
